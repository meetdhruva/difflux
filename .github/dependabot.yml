version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
      rust-dependencies:
        patterns: ["*"]
        exclude-patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
