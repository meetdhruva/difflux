name: release

# Push a tag like v0.1.0, or run this workflow manually with a tag name, to
# build every platform and publish a GitHub release. Manual runs create the tag
# at the selected branch's HEAD when it does not exist yet.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0 (created at the branch HEAD if missing)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag on manual runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
      - name: Create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi

  build:
    name: build ${{ matrix.name }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { name: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { name: linux-x86_64-cli-static, target: x86_64-unknown-linux-musl, os: ubuntu-22.04, headless: true }
          - { name: linux-arm64-cli-static, target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, headless: true }
          - { name: macos-x86_64, target: x86_64-apple-darwin, os: macos-latest, no-smoke: true }
          - { name: macos-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { name: windows-arm64, target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # Windows on Arm images may not ship rustup yet.
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p difflux ${{ matrix.headless && '--no-default-features' || '' }}

      - name: Smoke test
        if: ${{ !matrix.no-smoke }}
        run: |
          bin=target/${{ matrix.target }}/release/difflux
          "$bin" --version
          printf 'a\nb\n' > left.txt; printf 'a\nc\n' > right.txt
          set +e; "$bin" diff left.txt right.txt; code=$?; set -e
          [ "$code" = 1 ] || { echo "::error::expected exit code 1, got $code"; exit 1; }
          set +e; "$bin" diff --json left.txt right.txt > report.json; code=$?; set -e
          [ "$code" = 1 ] || { echo "::error::expected exit code 1 from --json, got $code"; exit 1; }
          grep -q '"schema": "difflux/1"' report.json

      - name: Package
        run: |
          name="difflux-${TAG}-${{ matrix.name }}"
          src="target/${{ matrix.target }}/release"
          exe=""; case "${{ matrix.target }}" in *windows*) exe=".exe";; esac
          mkdir -p "dist/$name" bins
          for b in difflux difflux-app; do
            if [ -f "$src/$b$exe" ]; then cp "$src/$b$exe" "dist/$name/"; cp "$src/$b$exe" bins/; fi
          done
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a -tzip "$name.zip" "$name" > /dev/null ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
          rm -rf "$name"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(matrix.name, 'macos-')
        with:
          name: bins-${{ matrix.name }}
          path: bins/*
          if-no-files-found: error

  macos-universal:
    name: build macos-universal (+ .app)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bins-macos-*
          path: bins
      - name: Universal binaries, app bundle and archives
        run: |
          version="${TAG#v}"
          mkdir -p dist universal
          for b in difflux difflux-app; do
            lipo -create bins/bins-macos-x86_64/$b bins/bins-macos-arm64/$b -output universal/$b
            chmod +x universal/$b
          done
          universal/difflux --version

          name="difflux-${TAG}-macos-universal"
          mkdir -p "$name"
          cp universal/difflux universal/difflux-app README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

          app=difflux.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp universal/difflux-app "$app/Contents/MacOS/difflux-app"
          cp universal/difflux "$app/Contents/MacOS/difflux"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>difflux</string>
            <key>CFBundleDisplayName</key><string>difflux</string>
            <key>CFBundleIdentifier</key><string>io.github.meetdhruva.difflux</string>
            <key>CFBundleExecutable</key><string>difflux-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature: required on Apple Silicon. Not notarized, see README.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "dist/difflux-${TAG}-macos-universal.app.zip"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF2'

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows x64 / Arm64 | `difflux-*-windows-x86_64.zip`, `difflux-*-windows-arm64.zip` |
          | macOS app (Apple Silicon + Intel) | `difflux-*-macos-universal.app.zip` |
          | macOS command line | `difflux-*-macos-universal.tar.gz` (or per-architecture archives) |
          | Linux x64 / Arm64 (desktop + CLI) | `difflux-*-linux-x86_64.tar.gz`, `difflux-*-linux-arm64.tar.gz` |
          | Linux static CLI + MCP, no GUI | `difflux-*-linux-*-cli-static.tar.gz` |

          `difflux` is the command line (and opens the app when given no subcommand);
          `difflux-app` opens the desktop app without a console window.
          Builds are not code-signed yet: on macOS right-click the app and choose **Open**
          the first time; on Windows choose **More info → Run anyway**.

          Verify a download: `sha256sum --check --ignore-missing SHA256SUMS` and
          `gh attestation verify <file> --repo ${{ github.repository }}`.
          EOF2
          cat notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "difflux $TAG" --notes-file notes.md $pre
          fi
